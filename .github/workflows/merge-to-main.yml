name: Merge to Main

# Reusable: called by a repo's promote-main.yml when a v* tag is pushed (a release, cut from
# experimental). Merges the tagged commit into main (the release branch), then fast-forwards
# experimental up to main so main is never left ahead of experimental. Uses the built-in
# GITHUB_TOKEN (unprotected branches); README.md conflicts auto-resolve to the target branch's
# copy. The jar/npm publish + README regeneration are triggered separately by the same v* tag push
# in the repo's own build/publish workflow -- not here.
on:
  workflow_call: {}

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge tagged commit into main, then sync experimental up to main
        run: |
          git fetch origin
          git checkout main
          if ! git merge --no-ff "$GITHUB_SHA" -m "Automated merge from tag ${GITHUB_REF_NAME} into main"; then
            echo "Merge conflict, auto-resolving README.md to main's copy..."
            git checkout main -- README.md 2>/dev/null || git rm README.md 2>/dev/null || true
            git add -A
            git commit --no-edit
          fi
          git push origin main
          # Keep main from ever drifting ahead of experimental: bring the release merge back onto
          # experimental. A fast-forward suffices when experimental still points at the released
          # commit; if experimental advanced during the release, fall back to a merge so experimental
          # still ends at or ahead of main (never behind).
          if git ls-remote --exit-code --heads origin experimental >/dev/null 2>&1; then
            git checkout experimental
            if ! git merge --ff-only main; then
              echo "experimental advanced past the release; merging main into experimental instead of fast-forward..."
              if ! git merge --no-ff main -m "Sync experimental up to main after release ${GITHUB_REF_NAME}"; then
                echo "Merge conflict, auto-resolving README.md to experimental's copy..."
                git checkout experimental -- README.md 2>/dev/null || git rm README.md 2>/dev/null || true
                git add -A
                git commit --no-edit
              fi
            fi
            git push origin experimental
          fi
